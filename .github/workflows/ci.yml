name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run runtime tests (npm test)
        run: npm test

      - name: Run static type verification (npm run test:types)
        run: npm run test:types

      - name: Run build & distribution verification (npm run test:dist)
        run: npm run test:dist -- --node

      - name: Verify generated docs & LLMs files are up-to-date
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: git diff --ignore-space-at-eol --exit-code docs.json llms.txt llms-full.txt

  bun-test:
    name: Bun on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Run runtime test suite with Bun
        run: bun --conditions=@df-script/source run _tests/run_all_project_tests.ts

      - name: Build dist & verify it in Bun
        run: npm run test:dist -- --bun

  deno-test:
    name: Deno on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Bundle test suite for Deno
        run: npx esbuild _tests/run_all_browser_tests.ts --bundle --platform=neutral --format=esm --conditions=@df-script/source --outfile=dist/deno-test-bundle.mjs --external:node:* --external:fs --external:path --ignore-annotations

      - name: Run runtime test suite with Deno
        run: deno run -A dist/deno-test-bundle.mjs

      - name: Build dist & verify it in Deno
        run: npm run test:dist -- --deno

  browser-test:
    name: Browser Engines (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers & OS dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser verification (Chromium, Firefox, WebKit)
        run: npm run test:browser

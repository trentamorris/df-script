name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run runtime tests (npm test)
        run: npm test

      - name: Run static type verification (npm run test:types)
        run: npm run test:types

      - name: Run build & distribution verification (npm run test:dist)
        run: npm run test:dist

      - name: Verify generated docs & LLMs files are up-to-date
        run: git diff --exit-code docs.json llms.txt llms-full.txt
